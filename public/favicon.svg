<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Their lotus, redrawn, on their navy. Flat gold: the original's bevel
       gradient is illegible at 16px, which is most of what a favicon is. -->
  <rect width="100" height="100" rx="20" fill="#1a2a40"/>
  <g fill="#eecc7a">
    <g transform="translate(50 64)">
      <path d="M0 0 C 0.62 -0.30, 0.50 -0.74, 0 -1 C -0.50 -0.74, -0.62 -0.30, 0 0 Z" transform="rotate(-74) scale(20 25)"/>
      <path d="M0 0 C 0.62 -0.30, 0.50 -0.74, 0 -1 C -0.50 -0.74, -0.62 -0.30, 0 0 Z" transform="rotate(74) scale(20 25)"/>
      <path d="M0 0 C 0.62 -0.30, 0.50 -0.74, 0 -1 C -0.50 -0.74, -0.62 -0.30, 0 0 Z" transform="rotate(-38) scale(17 30)"/>
      <path d="M0 0 C 0.62 -0.30, 0.50 -0.74, 0 -1 C -0.50 -0.74, -0.62 -0.30, 0 0 Z" transform="rotate(38) scale(17 30)"/>
      <path d="M0 0 C 0.62 -0.30, 0.50 -0.74, 0 -1 C -0.50 -0.74, -0.62 -0.30, 0 0 Z" transform="scale(13 34)"/>
    </g>
    <circle cx="50" cy="24" r="3.4"/>
  </g>
  <g fill="none" stroke="#eecc7a" stroke-width="2.2" stroke-linecap="round">
    <path d="M20 68 C 33 74, 67 63, 80 69"/>
    <path d="M20 69 C 33 63, 67 74, 80 68"/>
  </g>
</svg>
